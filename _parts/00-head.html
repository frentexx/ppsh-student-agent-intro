<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學生 Agent 入門｜從會聊天到會做事</title>
<meta name="description" content="屏北高中學生 Agent 入門：Agent 與 Chat AI 的差異、基本概念、領取課程點數、專案起始與生圖範例提示語。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10141F; --bg-2:#161B27;
  --ink:#F3F6FB; --ink-2:#C8D2E0; --ink-3:#9BA9BD; --ink-4:#6B7891;
  --accent:#7CB7E8; --accent-2:#E0A458; --warn:#E0A458; --bad:#D96A5A; --ok:#7FC8A0;
  --t1:60px; --t2:40px; --t3:26px; --t4:19px;
  --s1:56px; --s2:40px; --s3:24px; --s4:16px; --s5:8px;
  --gap:24px; --radius:16px;
  --line:rgba(203,213,229,0.2);
  --card:rgba(255,255,255,.045);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;font-weight:400;
  overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 12% -10%,rgba(124,183,232,.11),transparent 60%),
    radial-gradient(800px 560px at 92% 108%,rgba(224,164,88,.095),transparent 60%)}

/* 全域 UI */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:40;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .45s ease}
#section-tag{position:fixed;top:var(--s3);left:var(--s2);z-index:30;
  font-family:"JetBrains Mono",monospace;font-size:var(--t4);letter-spacing:.16em;color:var(--ink-3)}
#pageInfo{position:fixed;bottom:var(--s3);right:var(--s2);z-index:30;
  font-family:"JetBrains Mono",monospace;font-size:var(--t4);color:var(--ink-4);letter-spacing:.1em}
#hint{position:fixed;bottom:var(--s3);left:var(--s2);z-index:30;
  font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:14px;color:var(--ink-4);letter-spacing:.08em}

/* slide */
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:var(--s1) 72px;opacity:0;pointer-events:none;z-index:1;
  transition:opacity .5s ease,transform .5s ease;transform:translateY(16px);overflow:hidden}
.slide.active{opacity:1;pointer-events:auto;transform:translateY(0);z-index:2}
.slide-inner{width:100%;max-width:1320px;zoom:var(--k,1)}
#section-tag,#pageInfo,#hint{zoom:var(--k,1)}

/* 文字 */
.kicker{font-family:"JetBrains Mono",monospace;font-size:var(--t4);letter-spacing:.2em;
  color:var(--accent);margin:0 0 var(--s4)}
h1{font-size:var(--t1);font-weight:900;line-height:1.16;margin:0 0 var(--s3);letter-spacing:.01em}
h2{font-size:var(--t2);font-weight:700;line-height:1.28;margin:0 0 var(--s3)}
h3{font-size:var(--t3);font-weight:700;line-height:1.4;margin:0 0 var(--s5)}
p,li{font-size:var(--t3);line-height:1.7;color:var(--ink-2);margin:0 0 var(--s4)}
.lead{font-size:var(--t2);line-height:1.5;color:var(--ink)}
.small{font-size:var(--t4);color:var(--ink-3);line-height:1.7}
.hl{color:var(--accent);font-weight:700}
.hl2{color:var(--accent-2);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.dim{color:var(--ink-4)}
code,.mono{font-family:"JetBrains Mono","Noto Sans TC",monospace}
code{background:rgba(255,255,255,.08);padding:1px 8px;border-radius:6px;font-size:.82em;color:var(--ink)}

/* 版面 */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2);align-items:center}
.grid2s{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--s3);position:relative;overflow:hidden}
.card .num{font-family:"JetBrains Mono",monospace;font-size:var(--t4);color:var(--accent);
  letter-spacing:.16em;margin-bottom:var(--s5);display:block}
.card.accent{border-color:rgba(124,183,232,.46);background:rgba(124,183,232,.077)}
.card.accent2{border-color:rgba(224,164,88,.44);background:rgba(224,164,88,.074)}
.card.danger{border-color:rgba(217,106,90,.5);background:rgba(217,106,90,.08)}
.card p{font-size:var(--t4);margin:0 0 var(--s5);color:var(--ink-2);line-height:1.7}
.card h3{font-size:var(--t3)}
.card ul{margin:0;padding-left:1.1em}
.card li{font-size:var(--t4);margin:0 0 6px;line-height:1.65}

.divider{text-align:center}
.divider .big{font-size:120px;font-weight:900;line-height:1;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:var(--s3)}

/* 流程條 */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap}
.flow .st{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:var(--s4) 14px;text-align:center;position:relative}
.flow .st b{display:block;font-size:var(--t4);color:var(--ink);margin-bottom:4px}
.flow .st>span{display:block;font-size:16px;color:var(--ink-3);line-height:1.5}
.flow .st.hot{border-color:rgba(224,164,88,.55);background:rgba(224,164,88,.08)}
.flow .st.cool{border-color:rgba(124,183,232,.5);background:rgba(124,183,232,.08)}
.flow .ar{flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:var(--ink-4);font-size:24px}
.flow .st .n{font-family:"JetBrains Mono",monospace;color:var(--accent);font-size:15px;letter-spacing:.14em;display:block;margin-bottom:4px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:var(--t4)}
th,td{padding:12px var(--s3);text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink-3);font-weight:700;letter-spacing:.08em}
td{color:var(--ink-2);line-height:1.6}
td strong{color:var(--ink)}

/* 樹狀目錄 */
.tree{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:21px;line-height:1.95;color:var(--ink-2);white-space:pre;margin:0}
.tree .c{color:var(--ink-4)}
.tree .y{color:var(--accent-2);font-weight:700}
.tree .b{color:var(--accent);font-weight:700}

/* 提示語卡 */
.prompt{background:rgba(124,183,232,.07);border:1px solid rgba(124,183,232,.4);border-radius:14px;
  padding:var(--s4) var(--s3);position:relative;margin-bottom:var(--s4)}
.prompt .tag{font-family:"JetBrains Mono","Noto Sans TC",monospace;font-size:15px;letter-spacing:.14em;
  color:var(--accent);margin-bottom:6px;display:block}
.prompt p{margin:0;font-size:21px;line-height:1.7;color:var(--ink);padding-right:72px}
.prompt button{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.08);color:var(--ink-2);
  border:1px solid var(--line);border-radius:8px;padding:4px 14px;font:inherit;font-size:15px;cursor:pointer}
.prompt button:hover{border-color:var(--accent);color:var(--accent)}
.prompt button.done{color:var(--ok);border-color:var(--ok)}
.part{color:var(--accent-2);font-weight:700}

/* SVG */
svg{display:block;width:100%;height:auto}
svg text{font-family:"Noto Sans TC",system-ui,sans-serif;fill:var(--ink-2)}
svg .t-ink{fill:var(--ink)}
svg .t-acc{fill:var(--accent)}
svg .t-acc2{fill:var(--accent-2)}
svg .t-dim{fill:var(--ink-3)}
svg .box{fill:rgba(255,255,255,.05);stroke:rgba(203,213,229,.28);stroke-width:1.5}
svg .box-a{fill:rgba(124,183,232,.1);stroke:rgba(124,183,232,.6);stroke-width:1.5}
svg .box-b{fill:rgba(224,164,88,.1);stroke:rgba(224,164,88,.6);stroke-width:1.5}
svg .ln{stroke:var(--ink-4);stroke-width:2;fill:none}
svg .ln-a{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .ln-b{stroke:var(--accent-2);stroke-width:2.5;fill:none}

/* 講者備忘稿（N 鍵） */
.notes{display:none}
body.show-notes .slide.active .notes{display:block;position:fixed;left:var(--s2);right:var(--s2);bottom:60px;
  max-height:38vh;overflow:auto;z-index:50;background:rgba(10,13,22,.96);border:1px solid var(--accent);
  border-radius:14px;padding:var(--s3);font-size:18px;line-height:1.75;color:var(--ink-2)}
body.show-notes .slide.active .notes::before{content:"講者備忘";display:block;margin-bottom:var(--s5);
  font-family:"JetBrains Mono","Noto Sans TC",monospace;color:var(--accent);letter-spacing:.14em;font-size:15px}
.notes p,.notes li{font-size:18px;margin:0 0 8px}

.credit{font-size:15px;color:var(--ink-4);line-height:1.7}
.credit a{color:var(--accent)}

/* 小螢幕（手機）：改成直向捲動閱讀，不是主要使用情境 */
@media (max-width:900px){
  body{overflow:auto}
  .slide{position:relative;opacity:1;transform:none;pointer-events:auto;padding:40px 18px;border-bottom:1px solid var(--line)}
  .slide-inner{zoom:1}
  .grid2,.grid2s,.grid3,.grid4{grid-template-columns:1fr}
  .flow{flex-direction:column}.flow .ar{transform:rotate(90deg);flex-basis:28px}
  :root{--t1:38px;--t2:28px;--t3:20px;--t4:17px}
  #hint,#pageInfo,#section-tag{display:none}
  .tree{font-size:15px;overflow:auto}
  .notes{display:none!important}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="section-tag"></div>
<div id="pageInfo"></div>
<div id="hint">← → 換頁　F 全螢幕　N 講者備忘</div>
