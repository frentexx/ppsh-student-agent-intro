
<script>
const slides = [...document.querySelectorAll('.slide')];
const total = slides.length;
let cur = 0;

/* 等比縮放：以 1366×768 為基準（小於基準時略縮，最小 0.6） */
function fit(){
  const k = Math.max(0.6, Math.min(innerWidth/1366, innerHeight/768));
  document.documentElement.style.setProperty('--k', k.toFixed(4));
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);

function render(){
  fit();
  slides.forEach((s,i)=> s.classList.toggle('active', i===cur));
  document.getElementById('progress').style.width = ((cur+1)/total*100)+'%';
  document.getElementById('pageInfo').textContent = String(cur+1).padStart(2,'0')+' / '+total;
  document.getElementById('section-tag').textContent = '— '+slides[cur].dataset.section+' —';
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
}
function go(n){ cur = Math.max(0, Math.min(total-1, n)); render(); }

document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(total-1); }
  else if(e.key==='f'||e.key==='F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if(e.key==='n'||e.key==='N'){ document.body.classList.toggle('show-notes'); }
});
document.addEventListener('click', e=>{
  if(innerWidth<=900) return;
  if(e.target.closest('button, a, .notes, .prompt')) return;
  go(e.clientX > innerWidth*0.7 ? cur+1 : (e.clientX < innerWidth*0.3 ? cur-1 : cur));
});
/* 觸控滑動 */
let tx = null;
document.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e=>{
  if(tx===null || innerWidth<=900) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 60) go(cur + (dx<0 ? 1 : -1));
}, {passive:true});

/* 提示語複製按鈕 */
document.querySelectorAll('.prompt button').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const text = btn.parentElement.querySelector('p[data-copy]').textContent.trim();
    try{
      await navigator.clipboard.writeText(text);
    }catch(err){
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e2){}
      ta.remove();
    }
    btn.textContent = '已複製'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = '複製'; btn.classList.remove('done'); }, 1500);
  });
});

/* 網址 #5 直接跳到第 5 頁 */
const h = parseInt(location.hash.slice(1), 10);
if(h >= 1 && h <= total) cur = h - 1;
render();
</script>
</body>
</html>
